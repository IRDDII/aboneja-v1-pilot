<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aboneja Ime V1</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<script src="vendor/qrcode.min.js"></script>
<style>
/* ── Skena rreth telefonit — ndjek temën e shikuesit ─────────────────── */
/* v13 (24 shtator): skena merr ngjyrat dhe shkronjat e faqes (tools/product-site/css/site.css) —
   letër lejlaku / mesnatë, indigo si theks — që demoja të duket pjesë e faqes, jo një botë tjetër. */
:root{ --stage:#F6F5FC; --stage-ink:#12163A; --stage-soft:#6B6F94; --stage-line:#DAD6EE; --stage-card:#FFFFFF; --stage-accent:#4B3FD8;
  --font-display:"Segoe UI Variable Display","SF Pro Display",-apple-system,"Helvetica Neue",Roboto,"Inter",system-ui,sans-serif;
  --font-text:"Segoe UI Variable Text","SF Pro Text",-apple-system,"Helvetica Neue",Roboto,"Inter",system-ui,sans-serif; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --stage:#0A0F2E; --stage-ink:#EEF0FF; --stage-soft:#A3A8D4; --stage-line:rgba(207,198,255,.16); --stage-card:#141A45; --stage-accent:#CFC6FF; }
}
:root[data-theme="dark"]{ --stage:#0A0F2E; --stage-ink:#EEF0FF; --stage-soft:#A3A8D4; --stage-line:rgba(207,198,255,.16); --stage-card:#141A45; --stage-accent:#CFC6FF; }
html,body{height:100%}
body{background:var(--stage);color:var(--stage-ink);font-family:var(--font-text);font-size:15px;line-height:1.5}
.stage{min-height:100%;display:flex;gap:56px;justify-content:center;align-items:center;padding-inline:16px;padding-block:32px;box-sizing:border-box}
.panel{width:290px;display:flex;flex-direction:column;gap:22px}
.panel h1{font-weight:800;font-size:24px;line-height:1.15;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stage-soft);font-weight:600}
.panel p{margin:0;color:var(--stage-soft)}
.jump{display:flex;flex-direction:column;border-top:1px solid var(--stage-line)}
.jump button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--stage-line);color:var(--stage-ink)}
.jump button span{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--stage-soft);width:20px}
.jump button[aria-current="true"]{font-weight:700}
.jump button:focus-visible{outline:2px solid var(--stage-accent);outline-offset:2px}
.modes{display:flex;border:1px solid var(--stage-line);border-radius:14px;padding:3px;gap:3px;background:var(--stage-card)}
.modes button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 0;border-radius:11px;font-weight:700;font-size:13px;color:var(--stage-soft)}
.modes button[aria-pressed="true"]{background:var(--stage-accent);color:var(--stage-card)}
.modes button:focus-visible{outline:2px solid var(--stage-accent);outline-offset:2px}
.excluded{font-size:13px;color:var(--stage-soft);border-top:1px solid var(--stage-line);padding-top:14px}
.excluded b{color:var(--stage-ink);font-weight:600}

/* ── Telefoni — gjuha e modelit (DEMO 07) ─────────────────────────────── */
.phone{
  /* v13: paleta e faqes — bojë #12163A, indigo #4B3FD8 → vjollcë #7B5CFA, mente #6EE7B7, rozë #FF4F9A. */
  --bg:linear-gradient(165deg,#F7F6FD 0%,#FFFFFF 42%,#F1F3FE 100%);
  --surface:#FFFFFF; --ink:#12163A; --ink-2:#434869; --ink-3:#6B6F94; --line:#E4E1F4; --line-soft:#EFEDF9;
  --navy:#4B3FD8; --navy-grad:linear-gradient(135deg,#4B3FD8 0%,#7B5CFA 100%); --navy-ink:#FFFFFF; --navy-shadow:0 12px 26px -10px rgba(75,63,216,.55);
  --chip:#ECEAFB; --chip-ink:#4B3FD8;
  --mint:#0E9F74; --mint-grad:linear-gradient(100deg,#7CEFC5 0%,#3DD6A3 100%); --mint-on:#053B2A; --mint-chip:#E6FBF3; --mint-soft:#E3FAF1; --mint-line:#A9ECD2; --mint-shadow:0 12px 24px -10px rgba(16,185,129,.45);
  --rose:var(--pink); --rose-grad:linear-gradient(100deg,#FFD3E6 0%,#FFB3D3 100%); --rose-soft:var(--pink-soft); --rose-line:var(--pink-line); --rose-ink:var(--pink-ink); --rose-neon:#FF4F9A;
  --info:#EEF3FF; --info-line:#D6E2FF; --info-ink:#2F6BFF;
  --pink:#FF6FAE; --pink-soft:#FFEFF6; --pink-line:#FFD0E4; --pink-ink:#B01E61;
  --danger:#D93F4C; --shadow:0 1px 2px rgba(18,22,58,.05),0 12px 30px -16px rgba(18,22,58,.22); --btn-shadow:0 4px 14px -6px rgba(18,22,58,.14);
  font-family:var(--font-text);
  width:390px;height:810px;max-width:100%;border-radius:46px;background:var(--bg);color:var(--ink);
  box-shadow:0 0 0 10px #111827,0 30px 70px rgba(17,24,39,.28);position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none;
}
.phone[data-mode="dark"]{
  --bg:linear-gradient(165deg,#0B1033 0%,#0E1438 50%,#121A45 100%);
  --surface:#161C4A; --ink:#EEF0FF; --ink-2:#C9CCEA; --ink-3:#9EA3CF; --line:#2A3166; --line-soft:#1F2658;
  --navy:#CFC6FF; --navy-grad:linear-gradient(135deg,#5B4DF0 0%,#8B6CFF 100%); --navy-ink:#FFFFFF; --navy-shadow:0 12px 26px -10px rgba(0,0,0,.55);
  --chip:#252C63; --chip-ink:#DCD6FF;
  --mint:#6EE7B7; --mint-grad:linear-gradient(100deg,#2FBF8F 0%,#1E9E77 100%); --mint-on:#FFFFFF; --mint-chip:#0F3A30; --mint-soft:#10352C; --mint-line:#1F6B53; --mint-shadow:0 12px 24px -10px rgba(0,0,0,.45);
  --rose:var(--pink); --rose-grad:linear-gradient(100deg,#B04A7C 0%,#9C3F6E 100%); --rose-soft:var(--pink-soft); --rose-line:var(--pink-line); --rose-ink:var(--pink-ink); --rose-neon:#FF7AB6;
  --info:#1A2660; --info-line:#2A3A80; --info-ink:#A9C2FF;
  --pink:#FF8EC2; --pink-soft:#3A1A33; --pink-line:#6B2F55; --pink-ink:#FFC2DD;
  --danger:#FF8A8A; --shadow:0 0 0 1px rgba(255,255,255,.03); --btn-shadow:none;
}
.status-bar{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:13px;font-weight:600;color:var(--ink)}
.status-bar i{width:18px;height:9px;border:1.5px solid currentColor;border-radius:3px;display:block;opacity:.7}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:10px 24px 24px;animation:in .22s ease both;position:relative}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}}

.display{font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.025em;margin:0;color:var(--navy)}
.phone[data-mode="dark"] .display{color:var(--ink)}
.h{font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0}
.sub-h{font-size:15px;color:var(--ink-3);margin:4px 0 0}
.lead{font-size:18px;color:var(--ink-2);margin:0;line-height:1.5}
.cap{font-size:13px;color:var(--ink-3);margin:0}
.label{font-size:12px;font-weight:600;color:var(--ink-3)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums}
.spacer{flex:1}
.screen > *{flex-shrink:0}

/* logoja e parë — pllaka blu-indigo me autobus */
.logo{width:88px;height:88px;border-radius:24px;background:var(--navy-grad);display:grid;place-items:center;box-shadow:var(--navy-shadow)}
.logo svg{width:44px;height:44px}

/* butonat — të gjerë, qoshe 16 */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:16px;font-weight:700;font-size:18px;width:100%;padding:0 22px;transition:transform .12s ease}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.btn-navy{background:var(--navy-grad);color:var(--navy-ink);box-shadow:var(--navy-shadow)}
.btn-mint{background:var(--mint-grad);color:#fff;box-shadow:var(--mint-shadow)}
.btn-soft{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--btn-shadow);font-size:16px;min-height:54px}
.btn-danger{background:var(--surface);color:var(--danger);border:1px solid var(--line);font-size:16px;min-height:54px}
.sq{all:unset;cursor:pointer;width:48px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--btn-shadow);display:grid;place-items:center;color:var(--ink-2);flex:none}
.sq:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;border-radius:10px;padding:5px 10px}
.badge-mint{background:var(--mint-soft);color:var(--mint);border:1px solid var(--mint-line)}
.badge-mint::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge-pink{background:var(--pink-soft);color:var(--pink-ink)}
.tagline{display:inline-block;font-size:15px;font-weight:500;color:var(--mint);background:var(--mint-soft);border:1px solid var(--mint-line);border-radius:10px;padding:10px 24px}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:24px;box-shadow:var(--shadow)}
/* Info — rresht i pastër: ikonë në pllakë mente, një fjali */
.info{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;padding:14px 16px;color:var(--ink-2);font-size:15px;line-height:1.4;box-shadow:var(--shadow)}
.info .ii{width:40px;height:40px;border-radius:13px;background:var(--mint-soft);color:var(--mint);display:grid;place-items:center;flex:none}
.info b{color:var(--ink);font-weight:700}

/* 01 Mirësevini */
.welcome{align-items:center;text-align:center;padding-top:70px}
.welcome .mid{display:flex;flex-direction:column;align-items:center;gap:22px}
.welcome .cta{width:100%;margin-top:42px;display:flex;flex-direction:column;align-items:center;gap:30px}
/* Cepi lart djathtas: gjuha dhe tema, krah për krah. */
.ctrls{position:absolute;left:20px;right:20px;top:4px;display:flex;justify-content:space-between;z-index:3}
.lang{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--btn-shadow)}
.lang:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* 00 Hyrja — animacioni i nisjes */
.intro{position:absolute;inset:0;z-index:5;background:linear-gradient(160deg,#243357 0%,#2C3D62 45%,#3F5189 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;cursor:pointer}
.intro .glow{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(111,184,166,.35) 0%,rgba(111,184,166,0) 65%);animation:glow 2.4s ease-out both}
.intro .tile{width:112px;height:112px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;position:relative;overflow:hidden;animation:pop .7s cubic-bezier(.2,1.4,.4,1) .15s both}
.intro .tile svg{width:56px;height:56px;animation:drive .9s cubic-bezier(.2,.9,.3,1) .45s both}
.intro .road{position:absolute;bottom:22px;left:18px;right:18px;height:2px;border-radius:2px;background:rgba(255,255,255,.35);transform-origin:left;animation:road .6s ease-out .55s both}
.intro .name{font-weight:800;font-size:34px;letter-spacing:-.02em;animation:rise .6s ease-out .95s both;position:relative}
.intro .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6FB8A6;margin-left:6px;vertical-align:middle;box-shadow:0 0 14px #6FB8A6;animation:blink 1s ease-in-out 1.4s both}
.intro .by{font-size:14px;color:rgba(255,255,255,.7);animation:rise .6s ease-out 1.2s both;position:relative}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes drive{from{transform:translateX(-120px)}to{transform:none}}
@keyframes road{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes glow{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.intro.out{animation:fadeout .35s ease-in both}
.phone[data-intro] .status-bar{background:#243357;color:#fff}
@keyframes fadeout{to{opacity:0;transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){.intro *,.intro{animation:none!important}}

/* QR dinamike */
.qrframe{align-self:center;position:relative;width:240px;height:240px;display:grid;place-items:center}
.qrframe svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.qrframe .qrwrap{position:relative}
.timer{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink-2);font-weight:500}
.timer b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.offline{width:196px;height:196px;border-radius:20px;background:var(--line-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--ink-2);font-size:14px;padding:16px;box-sizing:border-box}
.offline b{color:var(--ink)}
.who-row{display:flex;align-items:center;gap:12px}
.photo{width:52px;height:52px;border-radius:16px;background:var(--navy-grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}

/* Harta */
.map{margin-top:20px;padding:20px}
.stops{list-style:none;margin:14px 0 0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--navy-grad)}
.stops li{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;font-size:15px;color:var(--ink-2)}
.stops li i{width:26px;height:26px;border-radius:50%;background:var(--surface);border:4px solid #3F5189;box-sizing:border-box;flex:none;position:relative;z-index:1}
.stops li.end i{background:#3F5189}
.stops li.end{color:var(--ink);font-weight:700}

/* Paneli: çelësi i internetit */
.net{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--stage-line);background:var(--stage-card);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.net button{all:unset;cursor:pointer;width:44px;height:26px;border-radius:99px;background:#6EB984;position:relative;flex:none}
.net button::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.net button[aria-checked="false"]{background:var(--stage-line)}
.net button[aria-checked="false"]::after{right:auto;left:3px}
.net button:focus-visible{outline:2px solid var(--stage-accent);outline-offset:2px}
.replay{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--stage-accent);text-decoration:underline;text-underline-offset:3px}

/* 02 Kush je */
.who{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.role{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;color:var(--ink);box-shadow:var(--btn-shadow)}
.role:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.role .ico{width:52px;height:52px;border-radius:16px;background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;flex:none}
.role b{display:block;font-weight:700;font-size:17px}
.role .d{font-size:13px;color:var(--ink-3)}
.role .chev{margin-left:auto;color:var(--ink-3)}
.role.main{border:2px solid var(--navy);padding:22px 18px;box-shadow:var(--shadow)}
.phone[data-mode="dark"] .role.main{border-color:#5468A8}
.role.main .ico{width:60px;height:60px;border-radius:18px;background:var(--navy-grad);color:#fff;box-shadow:var(--navy-shadow)}
.role.main b{font-size:21px;font-weight:800}
.role.minor{padding:12px 16px;border-radius:18px;box-shadow:none;border-width:1px}
.role.minor .ico{width:42px;height:42px;border-radius:13px}
.role.minor b{font-size:15px;font-weight:600}

/* 03 Kreu */
.head{display:flex;align-items:center;gap:14px}
.head .avatar{width:60px;height:60px;border-radius:18px;background:var(--navy-grad);color:#fff;display:grid;place-items:center;box-shadow:var(--navy-shadow);flex:none}
.head h1{font-weight:800;font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em}
.head .sq{margin-left:auto}
.subcard{margin-top:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.subcard .row{display:flex;justify-content:space-between;align-items:center}
.subcard .prod{font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.line{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-weight:500}
.linechip{font-weight:700;font-size:13px;background:var(--navy-grad);color:#fff;padding:4px 10px;border-radius:9px}
.bar{height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint-grad);border-radius:99px}
.vrow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3)}
.vrow b{color:var(--ink);font-weight:600}
.actions{margin-top:18px;display:flex;flex-direction:column;gap:12px}

/* 04 Abonimi im */
.pass{margin-top:20px;overflow:hidden;padding:0}
.pass-top{padding:18px 20px;display:flex;align-items:center;gap:12px;background:var(--mint-soft);border-bottom:1px solid var(--mint-line)}
.pass-top .ok{width:40px;height:40px;border-radius:13px;background:var(--mint-grad);display:grid;place-items:center;color:#fff;flex:none}
.pass-top b{display:block;font-weight:800;font-size:17px;color:var(--ink)}
.pass-top span{font-size:13px;color:var(--mint);font-weight:600}
.pass-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.qrwrap{align-self:center;background:#fff;padding:12px;border-radius:20px;border:1px solid #E6E7EB}
.qr{width:172px;height:172px}
.qr img,.qr canvas{width:172px!important;height:172px!important;display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-weight:700;font-size:15px}
.scanlog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:14px}
.scanlog svg{color:var(--mint);flex:none}

/* 05 Bli */
.titlebar{display:flex;align-items:center;gap:16px}
.products{margin-top:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.products .ph{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin:2px 2px 4px}
.product{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:18px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.product:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.product .pn{font-weight:700;font-size:18px}
.product .pd{grid-column:1;font-size:14px;color:var(--ink-3)}
.product .pp{grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right;color:var(--navy);font-weight:800}
.phone[data-mode="dark"] .product .pp{color:var(--ink)}
.product .pp b{font-size:22px;display:block;line-height:1.1;letter-spacing:-.01em}
.product .pp span{font-size:13px;font-weight:700}
.product .tag{grid-column:1 / -1;justify-self:start;margin-top:8px}
.product.current{border-color:var(--pink)}

/* 06 Detajet */
.price{display:flex;align-items:baseline;gap:6px;color:var(--navy)}
.phone[data-mode="dark"] .price{color:var(--ink)}
.price b{font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1}
.price span{font-weight:700;font-size:16px}
.detail{margin-top:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.incl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.incl li{display:flex;gap:10px;font-size:15px;color:var(--ink-2)}
.incl li svg{flex:none;color:var(--mint);margin-top:3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;border:2px solid var(--line);color:var(--ink);font-size:15px;font-weight:500;background:var(--surface)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;flex:none}
.opt[aria-checked="true"]{border-color:var(--pink);background:var(--pink-soft)}
.opt[aria-checked="true"] .radio{border:6px solid var(--pink-ink)}
.opt:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.summary{display:flex;flex-direction:column;gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:14px}
.summary div{display:flex;justify-content:space-between;color:var(--ink-3)}
.summary div b{color:var(--ink);font-weight:700}
.paynote{font-size:12px;color:var(--ink-3);text-align:center;margin:10px 0 0}
.done{align-items:center;text-align:center;justify-content:center;gap:16px}
.bigok{width:96px;height:96px;border-radius:28px;background:var(--mint-grad);display:grid;place-items:center;color:#fff;box-shadow:var(--mint-shadow)}

/* 07 Llogaria */
.me{margin-top:22px;padding:18px;display:flex;align-items:center;gap:14px}
.me .avatar{width:60px;height:60px;border-radius:18px;background:var(--navy-grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.me b{font-weight:800;font-size:19px;display:block}
.settings{margin-top:16px;padding:6px 16px;display:flex;flex-direction:column}
.setting{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);color:var(--ink);font-size:15px;font-weight:500;cursor:pointer}
.setting:last-child{border-bottom:0}
.setting .si{width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;flex:none}
.setting .end{margin-left:auto;color:var(--ink-3);font-size:14px;display:flex;align-items:center;gap:4px}
.setting:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.seg{margin-left:auto;display:flex;background:var(--line-soft);border-radius:12px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--pink)}
.switch{margin-left:auto;width:46px;height:28px;border-radius:99px;background:var(--mint-grad);position:relative;flex:none}
.switch::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.switch[data-on="false"]{background:var(--line)}
.switch[data-on="false"]::after{right:auto;left:3px}

/* navigimi — ikonë në pllakë, si te modeli; «Bli» gjithmonë jeshil */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px 22px;border-top:1px solid var(--line);background:var(--surface)}
.tabbar[hidden]{display:none}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.tab .ic{width:46px;height:40px;border-radius:14px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] .ic{background:var(--chip);color:var(--chip-ink)}
.tab.buy{color:var(--mint)}
.tab.buy .ic{background:var(--mint-chip);color:var(--mint)}
.tab.buy[aria-current="page"] .ic{background:var(--mint-grad);color:#fff}
.tab:focus-visible{outline:2px solid var(--pink);border-radius:12px}

@media (max-width: 820px){
  .stage{flex-direction:column;gap:22px;padding-block:20px}
  .panel{width:100%;max-width:390px}
  .panel .jump,.panel .excluded{display:none}
}
@media (max-width: 440px){
  .phone{width:100%;height:780px;border-radius:28px;box-shadow:0 0 0 1px var(--stage-line)}
  .screen{padding-inline:18px}
}

/* ── v5: ndryshimet e 19 shtatorit ─────────────────────────────────── */
/* Mirësevini: blloku qendror në mes të ekranit */
.welcome{justify-content:center;padding-top:10px;padding-bottom:40px}
.welcome .mid{gap:20px}
.welcome .cta{margin-top:36px;gap:22px}
.type{min-height:1.5em}
.type .caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-2px;background:currentColor;animation:caret .7s steps(1) infinite}
.type.done .caret{display:none}
@keyframes caret{50%{opacity:0}}
.tagline.type{min-height:auto;min-width:10px;opacity:0;transition:opacity .15s}
.tagline.on{opacity:1}
.tagline.seal{animation:seal .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes seal{0%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1) rotate(-1.5deg)}}

/* Kush je */
.role .en{font-size:13px;color:var(--ink-3);font-weight:500}
.role.main .en{color:var(--ink-3)}

/* Hyrja / Regjistrimi */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--line-soft);border-radius:14px;padding:4px;margin-top:22px}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px 0;border-radius:11px;font-weight:700;font-size:15px;color:var(--ink-3)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tabs button:focus-visible{outline:2px solid var(--pink)}
.form{margin-top:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.field input{all:unset;box-sizing:border-box;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-size:16px;color:var(--ink);font-family:inherit}
.field input:focus{border-color:#3F5189;box-shadow:0 0 0 4px rgba(63,81,137,.12)}
.dy{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dy .field input{padding:0 12px}
.steps{display:flex;gap:6px;margin-top:18px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--mint-grad)}
.stepname{margin-top:10px;font-size:13px;font-weight:600;color:var(--ink-3)}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:16px}
.choice .ico{width:46px;height:46px;border-radius:14px;background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;flex:none}
.choice[aria-checked="true"]{border-color:var(--pink);background:var(--pink-soft)}
.choice:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp span{height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--ink)}
.otp span.on{border-color:#3F5189}
.stamp2{display:inline-block;font-weight:800;font-size:20px;color:var(--mint);border:2.5px solid var(--mint-line);border-radius:12px;padding:12px 22px;transform:rotate(-3deg);animation:seal .5s cubic-bezier(.3,1.6,.5,1) .15s both}

/* Kreu: menuja me tri vija */
.drawer-bg{position:absolute;inset:0;z-index:20;background:rgba(15,20,36,.45);animation:fadein .2s ease both}
.drawer{position:absolute;top:0;bottom:0;left:0;width:82%;z-index:21;background:var(--surface);box-shadow:10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column;padding:52px 18px 24px;box-sizing:border-box;animation:slidein .26s cubic-bezier(.2,.9,.3,1) both;overflow-y:auto}
@keyframes fadein{from{opacity:0}}
@keyframes slidein{from{transform:translateX(-100%)}}
@media (prefers-reduced-motion: reduce){.drawer,.drawer-bg{animation:none}}
.drawer .me2{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.drawer .me2 .photo{width:48px;height:48px;border-radius:15px;font-size:16px}
.drawer .me2 b{display:block;font-weight:800;font-size:17px}
.drawer .act{margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:var(--mint-soft);display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.drawer .act b{color:var(--mint)}
.drawer h4{margin:16px 4px 6px;font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;font-size:15px;font-weight:600;color:var(--ink)}
.mi .si{width:36px;height:36px;border-radius:11px;background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;flex:none}
.mi[aria-current="page"]{background:var(--line-soft)}
.mi.sub{padding-left:22px;font-weight:500;color:var(--ink-2)}
.mi.sub .si{width:30px;height:30px;border-radius:9px}
.mi:focus-visible{outline:2px solid var(--pink)}
.mi.out{color:var(--danger);margin-top:auto}
.mi.out .si{background:var(--pink-soft);color:var(--danger)}

/* Abonimet e mia: karta që mbahet shtypur */
.holdcard{all:unset;box-sizing:border-box;cursor:pointer;display:block;margin-top:18px;border-radius:26px;padding:22px;color:#fff;background:var(--navy-grad);box-shadow:var(--navy-shadow);position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .15s}
.holdcard:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.holdcard.pressing{transform:scale(.98)}
.holdcard .fill{position:absolute;left:0;bottom:0;height:5px;width:0;background:#6FB8A6}
.holdcard.pressing .fill{width:100%;transition:width .6s linear}
.holdcard .top{display:flex;justify-content:space-between;align-items:center}
.holdcard .st{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700}
.holdcard .st::before{content:"";width:7px;height:7px;border-radius:50%;background:#8BE0B4}
.holdcard .pn{font-weight:800;font-size:23px;margin:16px 0 4px;letter-spacing:-.01em}
.holdcard .ln{opacity:.85;font-weight:500}
.holdcard .dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);font-size:13px}
.holdcard .dates span{opacity:.7;display:block}
.holdcard .dates b{font-size:15px}
.holdcard .hint{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;background:rgba(255,255,255,.12);border-radius:14px;padding:12px;font-weight:700;font-size:15px}
.holdcard .hint svg{animation:tap 1.6s ease-in-out infinite}
@keyframes tap{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
@media (prefers-reduced-motion: reduce){.holdcard .hint svg{animation:none}}

/* Dritarja e QR-së — si QRTicketShell */
.qrmodal-bg{position:absolute;inset:0;z-index:30;background:rgba(10,14,28,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px;animation:fadein .2s both}
.qrmodal{width:100%;max-height:96%;overflow-y:auto;background:var(--surface);border-radius:28px;box-shadow:0 30px 60px rgba(0,0,0,.35);animation:popin .32s cubic-bezier(.2,1.3,.4,1) both}
@keyframes popin{from{opacity:0;transform:translateY(18px) scale(.94)}}
.qrmodal .qh{background:var(--navy-grad);color:#fff;padding:18px 20px 58px;position:relative}
.qrmodal .qh small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.qrmodal .qh b{display:block;font-weight:800;font-size:20px;margin-top:2px}
.qrmodal .qh span{font-size:13px;opacity:.85}
.qrmodal .x{all:unset;cursor:pointer;position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff}
.qrmodal .x:focus-visible{outline:2px solid #fff}
/* z-index: koka është element i pozicionuar; pa këtë ajo vizatohet MBI foton dhe e pret. */
.qrmodal .face{display:flex;flex-direction:column;align-items:center;margin-top:-48px;position:relative;z-index:2}
.qrmodal .face .photo{width:88px;height:88px;border-radius:50%;font-size:28px;box-shadow:0 0 0 5px var(--surface),0 10px 20px rgba(0,0,0,.18)}
.qrmodal .face small{margin-top:8px;font-size:12px;color:var(--ink-3);font-weight:600}
.qrmodal .qb{padding:10px 20px 20px;display:flex;flex-direction:column;gap:12px}
.qrmodal .rows{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.qrmodal .rows div{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line-soft);font-size:14px;color:var(--ink-3)}
.qrmodal .rows b{color:var(--ink);font-weight:700}

/* v6: rozë bojë uji, numëruesi, gjinia, vulosja me dritë */
.btn-rose{background:var(--rose-grad);color:var(--rose-ink);box-shadow:0 12px 26px rgba(224,107,160,.26)}
.phone[data-mode="dark"] .btn-rose{color:#fff;box-shadow:none}
.badge-rose{background:var(--rose-soft);color:var(--rose-ink);border:1px solid var(--rose-line)}

.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.count div{background:var(--line-soft);border-radius:14px;padding:10px 4px;text-align:center}
.count b{display:block;font-weight:800;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.count span{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.count div.sec b{color:var(--mint)}
.holdcard .count div{background:rgba(255,255,255,.14)}
.holdcard .count b{color:#fff}
.holdcard .count span{color:rgba(255,255,255,.7)}
.holdcard .count div.sec b{color:#8BE9C8}

.gender{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gender button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;color:var(--ink-2)}
.gender button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.gender button[aria-checked="true"][data-gender="f"],.gender button[aria-checked="true"][data-tgender="f"]{border-color:var(--rose);background:var(--rose-soft);color:var(--rose-ink)}
.gender button[aria-checked="true"][data-gender="m"],.gender button[aria-checked="true"][data-tgender="m"]{border-color:#3B82F6;background:var(--info);color:var(--info-ink)}

/* Vulosja — e njëjta koreografi, dy ngjyra: femër rozë neon, mashkull blu elektrike */
.seal{--sc:var(--rose-neon);--sc2:#FFC2E6;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;margin-top:34px;position:relative}
.seal[data-g="m"]{--sc:#3EA8FF;--sc2:#9AD2FF}
.seal .rings{position:absolute;top:0;width:210px;height:210px;pointer-events:none}
.seal .rings i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sc);opacity:0;animation:ripple 2.6s cubic-bezier(.2,.7,.3,1) infinite}
.seal .rings i:nth-child(2){animation-delay:.6s}
.seal .rings i:nth-child(3){animation-delay:1.2s}
@keyframes ripple{0%{transform:scale(.42);opacity:.55}70%{opacity:.12}100%{transform:scale(1);opacity:0}}
.seal .disc{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 30%, var(--sc2), var(--sc));box-shadow:0 0 0 10px color-mix(in srgb, var(--sc) 14%, transparent),0 0 42px color-mix(in srgb, var(--sc) 55%, transparent);animation:discin .6s cubic-bezier(.2,1.5,.4,1) both;position:relative;z-index:1}
@keyframes discin{from{opacity:0;transform:scale(.45) rotate(-14deg)}}
.seal .tick{animation:tick .45s ease-out .38s both}
@keyframes tick{from{opacity:0;transform:scale(.4)}}
.seal h1{animation:rise .5s ease-out .5s both}
.seal .mark{font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--sc);border:2.5px solid var(--sc);border-radius:12px;padding:10px 20px;transform:rotate(-3deg);text-shadow:0 0 14px color-mix(in srgb, var(--sc) 60%, transparent);box-shadow:0 0 18px color-mix(in srgb, var(--sc) 35%, transparent),inset 0 0 14px color-mix(in srgb, var(--sc) 12%, transparent);animation:stampin .5s cubic-bezier(.3,1.7,.5,1) .78s both}
@keyframes stampin{0%{opacity:0;transform:scale(1.5) rotate(-12deg)}70%{opacity:1;transform:scale(.96) rotate(-2deg)}100%{transform:scale(1) rotate(-3deg)}}
.seal .sub{animation:rise .5s ease-out 1s both;color:var(--ink-3);font-size:15px;max-width:280px}
@media (prefers-reduced-motion: reduce){.seal *,.seal .rings i{animation:none!important}}

/* Sinjali «mbaj shtypur» */
.holdcard .hint{background:rgba(255,255,255,.14);gap:10px}
.holdcard .hint .dots{display:inline-flex;gap:4px}
.holdcard .hint .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);animation:dot 1.4s ease-in-out infinite}
.holdcard .hint .dots i:nth-child(2){animation-delay:.18s}
.holdcard .hint .dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.holdcard.pressing .hint{background:rgba(255,255,255,.24)}
@media (prefers-reduced-motion: reduce){.holdcard .hint .dots i{animation:none}}

/* v11: dy dyert kryesore, QR sipas gjinisë, turisti me shtëpinë e vet */
.role.role--blue{border:2px solid #2E8BFF;box-shadow:0 0 0 2px rgba(120,195,255,.35),var(--shadow)}
.role.role--blue .ico{background:linear-gradient(100deg,#2E8BFF 0%,#1E6FE0 100%);color:#fff;box-shadow:0 10px 22px rgba(46,139,255,.32)}
.role.role--mint{border:2px solid #23CBB4;box-shadow:0 0 0 2px rgba(69,224,168,.32),var(--shadow)}
.role.role--mint .ico{background:linear-gradient(100deg,#45E0A8 0%,#23CBB4 100%);color:#06302A;box-shadow:0 10px 22px rgba(35,203,180,.32)}
.role.role--mint b,.role.role--blue b{font-size:20px}
.role .badge{white-space:nowrap;font-size:11.5px;padding:4px 9px}

/* «Hap QR-në» dhe koka e dritares marrin ngjyrën e udhëtarit: blu për burra, rozë për gra. */
.btn-qr-m{background:linear-gradient(100deg,#2E8BFF 0%,#1E6FE0 100%);color:#fff;box-shadow:0 0 0 2px rgba(120,195,255,.6),0 12px 26px rgba(30,111,224,.3)}
.btn-qr-f{background:linear-gradient(100deg,#FFA9DC 0%,#FF7FC8 100%);color:#5C0F3A;box-shadow:0 0 0 2px rgba(255,159,214,.65),0 12px 26px rgba(255,127,200,.28)}
.qrmodal[data-g="m"] .qh{background:linear-gradient(135deg,#2E8BFF 0%,#1E6FE0 100%)}
.qrmodal[data-g="f"] .qh{background:linear-gradient(135deg,#FFA9DC 0%,#FF7FC8 100%);color:#4A0C2E}
.qrmodal[data-g="f"] .qh small,.qrmodal[data-g="f"] .qh span{opacity:.85;color:inherit}
.qrmodal[data-g="f"] .x{background:rgba(255,255,255,.4);color:#4A0C2E}

/* Turisti: e njëjta formë si qytetari, me theks mente. */
.tflag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mint);background:var(--mint-soft);border:1px solid var(--mint-line);border-radius:999px;padding:5px 12px}
.tcard{background:linear-gradient(135deg,#1C6E63 0%,#23918A 100%);color:#fff}
.phone[data-mode="dark"] .tcard{background:linear-gradient(135deg,#12564E 0%,#177069 100%)}

/* v10: salla e stafit me skeda, rrjedhë live, kërkesa */
.sttabs{display:flex;gap:6px;margin-top:18px;background:var(--line-soft);border-radius:14px;padding:4px}
.sttabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:9px 0;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--ink-3);position:relative}
.sttabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sttabs button:focus-visible{outline:2px solid var(--pink)}
.sttabs .dotn{position:absolute;top:2px;right:6px;background:var(--rose);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px;font-style:normal}
.feed{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:12px 14px;box-shadow:var(--btn-shadow);animation:fin .3s ease both}
@keyframes fin{from{opacity:0;transform:translateY(-8px)}}
.fitem .fdot{width:10px;height:10px;border-radius:50%;flex:none}
.fitem b{font-size:14.5px;font-weight:700}
.fitem .fl{font-size:12.5px;color:var(--ink-3)}
.fitem .ft{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.fitem{animation:none}}
.reqs{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.req{background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;padding:16px;box-shadow:var(--btn-shadow)}
.req .rtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.req .rtop b{font-size:19px;font-weight:800}
.req .rwho{margin-top:10px;font-weight:700;font-size:15.5px}
.req .rowbtns{margin-top:12px}

/* v9: operatori dhe stafi */
.opbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--btn-shadow)}
.opbar .tchip{font-weight:800;font-size:12px;background:var(--navy-grad);color:#fff;border-radius:9px;padding:4px 9px;letter-spacing:.04em}
.opbar .ok{margin-left:auto;color:var(--mint);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.opbar .bad{margin-left:auto;color:var(--danger);font-weight:700}

.viewfinder{margin-top:16px;border-radius:26px;background:#0E1526;position:relative;overflow:hidden;aspect-ratio:1/1;display:grid;place-items:center}
.viewfinder::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.06), transparent 60%)}
.viewfinder .frame{width:62%;aspect-ratio:1/1;border-radius:20px;position:relative}
.viewfinder .frame i{position:absolute;width:34px;height:34px;border:4px solid #6FE3C0;border-radius:10px}
.viewfinder .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.viewfinder .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.viewfinder .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.viewfinder .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.viewfinder .laser{position:absolute;left:8%;right:8%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#6FE3C0,transparent);animation:laser 2.4s ease-in-out infinite}
@keyframes laser{0%,100%{top:14%}50%{top:84%}}
.viewfinder p{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:13px;font-weight:600}
@media (prefers-reduced-motion: reduce){.viewfinder .laser{animation:none;top:50%}}

.scenarios{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.scen{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:14.5px;font-weight:600}
.scen small{margin-left:auto;font-weight:700;font-size:11px;letter-spacing:.06em;border-radius:8px;padding:4px 8px;white-space:nowrap}
.scen{line-height:1.25}
.scen:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.v-ok{background:var(--mint-soft);color:var(--mint)}
.v-bad{background:#FDECEC;color:#C4453D}
.phone[data-mode="dark"] .v-bad{background:#3A2020;color:#FF9A92}
.v-warn{background:#FDF3E3;color:#9A6414}
.phone[data-mode="dark"] .v-warn{background:#3A2E18;color:#F4C97A}
.v-info{background:var(--info);color:var(--info-ink)}

.verdict{margin-top:18px;border-radius:26px;padding:24px 20px;text-align:center;color:#fff;animation:popin .32s cubic-bezier(.2,1.3,.4,1) both}
.verdict.ok{background:linear-gradient(140deg,#2ECFA0 0%,#1BB3A6 100%)}
.verdict.bad{background:linear-gradient(140deg,#D2504A,#A93A38)}
.verdict.warn{background:linear-gradient(140deg,#D79A2B,#B0761B)}
.verdict.info{background:linear-gradient(140deg,#3F6FD8,#2E56AE)}
.verdict .ico{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 14px}
.verdict h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.verdict .why{margin:6px 0 0;font-size:15px;opacity:.92}
.verdict .rc{display:inline-block;margin-top:12px;font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.06em;background:rgba(0,0,0,.18);border-radius:8px;padding:5px 10px}
.verdict .who{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22);display:flex;gap:12px;align-items:center;text-align:left}
.verdict .who .photo{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);font-size:16px}
.verdict .who b{display:block;font-size:16px}
.verdict .who span{font-size:13px;opacity:.85}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat div{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:14px;box-shadow:var(--btn-shadow)}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.split{margin-top:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.split .row2{display:flex;align-items:center;gap:12px;font-size:15px}
.split .row2 i{width:12px;height:12px;border-radius:4px;flex:none}
.split .row2 b{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.splitbar{display:flex;height:12px;border-radius:99px;overflow:hidden}
.splitbar i{display:block;height:100%}

/* v8: blu elektrike me neon, butona sipas gjinisë, njoftime të vogla */
.btn-electric{background:linear-gradient(100deg,#2E8BFF 0%,#1E6FE0 100%);color:#fff;
  box-shadow:0 0 0 2px rgba(120,195,255,.75),0 0 24px rgba(46,139,255,.55),0 12px 26px rgba(30,111,224,.32)}
.phone[data-mode="dark"] .btn-electric{box-shadow:0 0 0 2px rgba(120,195,255,.9),0 0 30px rgba(46,139,255,.7)}
.btn-neon-f{background:linear-gradient(100deg,#FFA9DC 0%,#FF7FC8 100%);color:#5C0F3A;
  box-shadow:0 0 0 2px rgba(255,159,214,.8),0 0 24px rgba(255,127,200,.5),0 12px 26px rgba(255,127,200,.3)}
.btn-neon-m{background:linear-gradient(100deg,#6BC4FF 0%,#2E8BFF 100%);color:#062442;
  box-shadow:0 0 0 2px rgba(120,195,255,.8),0 0 24px rgba(62,168,255,.5),0 12px 26px rgba(46,139,255,.3)}
.toast2{position:absolute;left:18px;right:18px;bottom:96px;z-index:40;background:var(--ink);color:var(--bg);
  border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:10px;animation:toastin .26s ease both}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion: reduce){.toast2{animation:none}}

/* v7: lista e abonimeve, blerja, harta live */
.subitem{border-radius:26px;padding:20px;color:#fff;background:var(--navy-grad);box-shadow:var(--navy-shadow);position:relative;overflow:hidden}
.subitem.primary{box-shadow:var(--navy-shadow),0 0 0 3px var(--mint)}
/* Vetëm abonimi i Kreut rri blu — të tjerët të lehtë, që ekrani të marrë frymë. */
.subitem:not(.primary){background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--btn-shadow)}
.subitem:not(.primary) .st{background:var(--mint-soft);color:var(--mint)}
.subitem:not(.primary) .st::before{background:var(--mint)}
.subitem:not(.primary) .ln{color:var(--ink-3);opacity:1}
.subitem:not(.primary) .dates{border-top-color:var(--line-soft)}
.subitem:not(.primary) .dates span{color:var(--ink-3);opacity:1}
.subitem:not(.primary) .btn-onnavy{background:var(--navy-grad);color:#fff}
.subitem:not(.primary) .btn-ghostwhite{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.subitem .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.subitem .st{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700}
.subitem .st::before{content:"";width:7px;height:7px;border-radius:50%;background:#8BE9C8}
.subitem .onhome{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:var(--mint-grad);color:#08312A;border-radius:10px;padding:5px 10px}
.subitem .pn{font-weight:800;font-size:21px;margin:14px 0 3px;letter-spacing:-.01em}
.subitem .ln{opacity:.85;font-weight:500}
.subitem .dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:13px}
.subitem .dates span{opacity:.7;display:block}
.subitem .dates b{font-size:15px}
.rowbtns{display:flex;gap:10px;margin-top:16px}
.rowbtns .btn{white-space:nowrap;font-size:14.5px;padding:0 14px;gap:8px}
.btn-onnavy{background:#fff;color:#22304E;min-height:48px;font-size:15px;flex:1}
.phone[data-mode="dark"] .btn-onnavy{background:#E8ECF6;color:#16203A}
.btn-ghostwhite{background:rgba(255,255,255,.14);color:#fff;min-height:48px;font-size:15px;flex:1}
.mini{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:12px;border-radius:14px;border:1px dashed var(--line);color:var(--ink-2);font-weight:600;font-size:14px}
.mini:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* Blerja — e njëjta koreografi si vulosja, në mente */
.seal[data-g="ok"]{--sc:#22C39C;--sc2:#8BE9C8}

/* Harta live */
.livebadge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mint);background:var(--mint-soft);border:1px solid var(--mint-line);border-radius:999px;padding:5px 12px}
.livebadge i{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:14px 18px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line-soft)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:50%;display:block}
.dotcitizen{animation:fadedot 6s ease-in-out infinite}
@keyframes fadedot{0%,100%{opacity:0}12%{opacity:.95}70%{opacity:.95}85%{opacity:0}}
@media (prefers-reduced-motion: reduce){.dotcitizen,.livebadge i{animation:none;opacity:.9}}

/* Harta — hartë e stilizuar */
.linepick{display:flex;gap:8px;margin-top:16px}
.linepick button{all:unset;cursor:pointer;padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2)}
.linepick button[aria-pressed="true"]{background:var(--navy-grad);color:#fff;border-color:transparent}
.linepick button:focus-visible{outline:2px solid var(--pink)}
.mapbox{margin-top:14px;padding:0;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapfoot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:14px;color:var(--ink-2)}
.mapfoot b{color:var(--ink)}

/* v13 — 24 shtator: ngjyra e udhëtarit, me NUANCA — jo një neon i vetëm kudo.
   .phone[data-tema]: f = rozë · m = blu · t = mente (turisti). Të tria vijnë nga paleta e faqes.
   Çdo nuancë ka vendin e vet, që ngjyrat të mos vrasin njëra-tjetrën:
     --acc-grad   ngjyra e fortë — VETËM veprimi kryesor («Hap QR-në») dhe fotoja për kontrollorin
     --acc-soft   nuanca e butë — avatari, L7, sfondet e vogla (me shkrim të errët --acc-soft-ink)
     --acc-mid    toni i mesëm — shiriti i kohës
     --acc-ring   rrethi i QR-së · --acc-head koka e QR-së dhe karta kryesore (shkrim --acc-head-ink)
   Jeshilja e statusit («Aktiv», «I vlefshëm») dhe e blerjes mbetet jeshile: aty ngjyra do të thotë diçka. */
.phone{--acc:#4B3FD8;--acc-grad:var(--navy-grad);--acc-ink:#fff;--acc-shadow:var(--navy-shadow);--acc-soft:var(--chip);--acc-soft-ink:var(--chip-ink);
  --acc-line:var(--line);--acc-mid:var(--navy-grad);--acc-ring:#7B5CFA;--acc-head:var(--navy-grad);--acc-head-ink:#fff}
.phone[data-tema="f"]{--acc:#E8388A;--acc-grad:linear-gradient(135deg,#FF7AB6 0%,#E8388A 100%);--acc-ink:#fff;--acc-shadow:0 12px 26px -10px rgba(232,56,138,.55);
  --acc-soft:#FFE9F3;--acc-soft-ink:#B01E61;--acc-line:#FFCFE3;--acc-mid:linear-gradient(90deg,#FFB3D3 0%,#FF6FAE 100%);--acc-ring:#FF6FAE;
  --acc-head:linear-gradient(135deg,#FFE6F1 0%,#FFC6DD 100%);--acc-head-ink:#7A1242}
.phone[data-tema="m"]{--acc:#2F6BFF;--acc-grad:linear-gradient(135deg,#5B8CFF 0%,#2350E0 100%);--acc-ink:#fff;--acc-shadow:0 12px 26px -10px rgba(47,107,255,.55);
  --acc-soft:#E8EFFF;--acc-soft-ink:#1F4FD6;--acc-line:#CCDAFF;--acc-mid:linear-gradient(90deg,#A9C2FF 0%,#4F80FF 100%);--acc-ring:#5B8CFF;
  --acc-head:linear-gradient(135deg,#E7EEFF 0%,#C8D8FF 100%);--acc-head-ink:#17307F}
.phone[data-tema="t"]{--acc:#0E9F74;--acc-grad:linear-gradient(135deg,#5BE3B2 0%,#17B886 100%);--acc-ink:#04362A;--acc-shadow:0 12px 26px -10px rgba(23,184,134,.5);
  --acc-soft:#E2FAF0;--acc-soft-ink:#047857;--acc-line:#AEEBD3;--acc-mid:linear-gradient(90deg,#A7F3D0 0%,#34D399 100%);--acc-ring:#34D399;
  --acc-head:linear-gradient(135deg,#E3FBF1 0%,#BDF2DA 100%);--acc-head-ink:#064E3B}
.phone[data-mode="dark"][data-tema="f"]{--acc:#FF6FAE;--acc-grad:linear-gradient(135deg,#FF7AB6 0%,#D9307F 100%);--acc-soft:#3A1830;--acc-soft-ink:#FFB8D6;--acc-line:#6B2F55;
  --acc-mid:linear-gradient(90deg,#B0467A 0%,#FF6FAE 100%);--acc-ring:#FF7AB6;--acc-head:linear-gradient(135deg,#4A1D3B 0%,#6B2753 100%);--acc-head-ink:#FFE1EE}
.phone[data-mode="dark"][data-tema="m"]{--acc:#6F97FF;--acc-grad:linear-gradient(135deg,#5B8CFF 0%,#2F5BE8 100%);--acc-soft:#1B2A66;--acc-soft-ink:#B8CBFF;--acc-line:#2F438F;
  --acc-mid:linear-gradient(90deg,#3355C4 0%,#6F97FF 100%);--acc-ring:#6F97FF;--acc-head:linear-gradient(135deg,#1D2C6E 0%,#2A3F96 100%);--acc-head-ink:#E3EBFF}
.phone[data-mode="dark"][data-tema="t"]{--acc:#4ADE9F;--acc-grad:linear-gradient(135deg,#34D399 0%,#10A374 100%);--acc-ink:#03261D;--acc-soft:#0F3A2E;--acc-soft-ink:#98F0CB;--acc-line:#1F6B53;
  --acc-mid:linear-gradient(90deg,#1E8F6A 0%,#4ADE9F 100%);--acc-ring:#4ADE9F;--acc-head:linear-gradient(135deg,#0F3F31 0%,#15614A 100%);--acc-head-ink:#DBFBEE}

/* Identiteti — i butë: pllakë e çelët, ikonë/shkronja në ngjyrën e thellë. */
.phone[data-tema] .head .avatar,.phone[data-tema] .me .avatar,.phone[data-tema] .drawer .me2 .photo{background:var(--acc-soft);color:var(--acc-soft-ink);box-shadow:inset 0 0 0 1.5px var(--acc-line)}
.phone[data-tema] .linechip{background:var(--acc-soft);color:var(--acc-soft-ink);box-shadow:inset 0 0 0 1px var(--acc-line)}
.phone[data-tema] .bar i{background:var(--acc-mid)}
.phone[data-tema] .count div.sec b{color:var(--acc)}
/* QR-ja: koka e butë, fotoja e fortë (e sheh kontrollori), rrethi në tonin e mesëm. */
.phone[data-tema] .qrmodal .qh{background:var(--acc-head);color:var(--acc-head-ink)}
.phone[data-tema] .qrmodal .qh small,.phone[data-tema] .qrmodal .qh span{color:inherit;opacity:.8}
.phone[data-tema] .qrmodal .x{background:rgba(255,255,255,.55);color:var(--acc-head-ink)}
.phone[data-mode="dark"][data-tema] .qrmodal .x{background:rgba(255,255,255,.14)}
.phone[data-tema] .qrmodal .face .photo{background:var(--acc-grad);color:var(--acc-ink);box-shadow:0 0 0 5px var(--surface),0 14px 26px -12px rgba(18,22,58,.45)}
.phone[data-tema] .qrframe .ringfill{stroke:var(--acc-ring)}
/* Veprimi kryesor — i vetmi me ngjyrë të plotë në ekran. */
.btn-acc{background:var(--acc-grad);color:var(--acc-ink);box-shadow:var(--acc-shadow)}
/* Karta kryesore te «Abonimet e mia»: nuancë e butë, jo bllok i fortë. */
.phone[data-tema] .subitem.primary{background:var(--acc-head);color:var(--acc-head-ink);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--acc-line)}
.phone[data-tema] .subitem.primary .st{background:rgba(255,255,255,.6);color:var(--acc-head-ink)}
.phone[data-mode="dark"][data-tema] .subitem.primary .st{background:rgba(255,255,255,.12)}
.phone[data-tema] .subitem.primary .st::before{background:#10B981}
.phone[data-tema] .subitem.primary .dates{border-top-color:color-mix(in srgb,var(--acc-head-ink) 14%,transparent)}
.phone[data-tema] .subitem.primary .btn-ghostwhite{background:rgba(255,255,255,.6);color:var(--acc-head-ink)}
.phone[data-mode="dark"][data-tema] .subitem.primary .btn-ghostwhite{background:rgba(255,255,255,.12)}
/* Turisti: karta e biletës në mente të butë me shkrim të errët; butoni i QR-së është veprimi kryesor. */
.phone[data-tema="t"] .tcard{background:var(--acc-head);color:var(--acc-head-ink);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--acc-line)}
.tcard .tbadge{background:rgba(255,255,255,.65);color:inherit}
.phone[data-mode="dark"] .tcard .tbadge{background:rgba(255,255,255,.12)}
.tcard .tline{color:inherit;opacity:.8}
.tcard .count div{background:rgba(255,255,255,.6)}
.phone[data-mode="dark"] .tcard .count div{background:rgba(255,255,255,.08)}
.tcard .count b,.phone[data-tema] .tcard .count div.sec b{color:inherit}
.tcard .count span{color:inherit;opacity:.7}
.tcard .tqr{margin-top:10px;background:var(--acc-grad);color:var(--acc-ink);box-shadow:var(--acc-shadow)}
.avbtn{all:unset;box-sizing:border-box;cursor:pointer}
.avbtn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* Kalimi i butë kur ndërrohet udhëtari (Arta ⇄ Ardit). */
.head .avatar,.linechip,.bar i,.count b,.btn-acc,.langsw button,.qrmodal .qh,.subitem,.tcard{transition:background-color .35s ease,color .35s ease,box-shadow .35s ease}

/* Vulosja: e njëjta koreografi, pa neon — rrathët dhe disku mbeten, shkëlqimi zbutet. */
.seal[data-g="f"]{--sc:#FF4F9A;--sc2:#FFB8D6}
.seal[data-g="m"]{--sc:#2F6BFF;--sc2:#A9C2FF}
.seal[data-g="t"],.seal[data-g="ok"]{--sc:#10B981;--sc2:#A7F3D0}
.seal .disc{box-shadow:0 0 0 10px color-mix(in srgb,var(--sc) 12%,transparent),0 16px 34px -12px color-mix(in srgb,var(--sc) 60%,transparent)}
.seal .mark{text-shadow:none;box-shadow:none;background:color-mix(in srgb,var(--sc) 7%,transparent)}

/* Dyert te «Kush je?» dhe butonat e hyrjes: ngjyrat e faqes, pa kornizë neon. */
.role.role--blue{border:1.5px solid #CCDAFF;box-shadow:var(--shadow)}
.role.role--blue .ico{background:linear-gradient(135deg,#5B8CFF 0%,#2350E0 100%);color:#fff;box-shadow:0 10px 22px -10px rgba(47,107,255,.6)}
.role.role--mint{border:1.5px solid #AEEBD3;box-shadow:var(--shadow)}
.role.role--mint .ico{background:linear-gradient(135deg,#5BE3B2 0%,#17B886 100%);color:#04362A;box-shadow:0 10px 22px -10px rgba(23,184,134,.55)}
.phone[data-mode="dark"] .role.role--blue{border-color:#2F438F}
.phone[data-mode="dark"] .role.role--mint{border-color:#1F6B53}
.btn-electric{background:var(--navy-grad);color:#fff;box-shadow:var(--navy-shadow)}
.phone[data-mode="dark"] .btn-electric{box-shadow:var(--navy-shadow)}
.btn-mint{color:var(--mint-on)}
.pass-top .ok,.bigok,.tab.buy[aria-current="page"] .ic{color:var(--mint-on)}
/* Verdiktet e operatorit: të qarta, pa u bërë alarm i kuq-portokalli. */
.verdict.ok{background:linear-gradient(140deg,#34D399 0%,#0E9F74 100%)}
.verdict.bad{background:linear-gradient(140deg,#F2555A 0%,#C8323A 100%)}
.verdict.warn{background:linear-gradient(140deg,#F7C04A 0%,#E09A12 100%);color:#3A2500}
.verdict.info{background:linear-gradient(140deg,#6F97FF 0%,#2F6BFF 100%)}

/* Shkronjat e faqes: titujt me «Display», teksti me «Text»; pesha 700 në vend të 800. */
.display,.h,.head h1,.subcard .prod,.product .pn,.subitem .pn,.price b,.me b,.drawer .me2 b,.role b,.qrmodal .qh b,.verdict h2,.stat b,.count b,.req .rtop b,.panel h1,.intro .name{font-family:var(--font-display)}
.h,.head h1,.subcard .prod,.subitem .pn,.me b,.drawer .me2 b,.role.main b,.qrmodal .qh b,.panel h1{font-weight:700;letter-spacing:-.02em}
.display{letter-spacing:-.03em}
/* Ndërveprimi: prekja ndihet, pa lëvizje të tepërt. */
.role,.product,.choice,.scen,.opt{transition:transform .12s ease,box-shadow .2s ease,border-color .2s ease}
.role:active,.product:active,.choice:active,.scen:active,.opt:active{transform:scale(.985)}
@media (hover: hover){ .role:hover,.product:hover,.choice:hover,.scen:hover{box-shadow:var(--shadow);border-color:var(--acc-line)} }
/* Ekrani nuk rinis animacionin e hyrjes kur ndryshon vetëm diçka brenda tij. */
.screen.noanim{animation:none}

/* Një veprim kryesor për ekran: blerja te Kreu dhe «Shto abonim» janë veprime të dyta — mente e butë. */
.btn-mint-soft{background:var(--mint-soft);color:var(--mint);box-shadow:inset 0 0 0 1.5px var(--mint-line)}
.phone[data-mode="dark"] .btn-mint-soft{color:#8FF3CB}
/* Zgjedhja aktuale ndjek udhëtarin (më parë ishte rozë edhe për Arditin). */
.phone[data-tema] .product.current{border-color:var(--acc-ring)}
.phone[data-tema] .product .badge-rose{background:var(--acc-soft);color:var(--acc-soft-ink);border-color:var(--acc-line)}
.phone[data-tema] .opt[aria-checked="true"],.phone[data-tema] .choice[aria-checked="true"]{border-color:var(--acc-ring);background:var(--acc-soft)}
.phone[data-tema] .opt[aria-checked="true"] .radio{border-color:var(--acc)}

/* Gjuha: dy zgjedhje të dukshme — gjithmonë shihet cila është aktive. */
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.langsw{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px 3px 3px 8px;box-shadow:var(--btn-shadow);color:var(--ink-3)}
.langsw .lg{display:grid;place-items:center;margin-right:3px}
.langsw button{all:unset;cursor:pointer;min-width:32px;text-align:center;padding:6px 8px;border-radius:9px;font-size:12.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-3)}
.langsw button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-soft-ink);box-shadow:inset 0 0 0 1px var(--acc-line)}
.langsw button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
